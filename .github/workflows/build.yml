name: Build

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        robot: [blue, orange]
        include:
          - robot: blue
            define: ROBOT_BLUE
          - robot: orange
            define: ROBOT_ORANGE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create robot_select.hpp for ${{ matrix.robot }}
        run: |
          mkdir -p include/config
          echo "#define ${{ matrix.define }}" > include/config/robot_select.hpp
          cat include/config/robot_select.hpp

      - name: Setup PROS
        uses: LemLib/pros-build@v3.0.0

      - name: Build ${{ matrix.robot }} robot
        run: pros make

      - name: Upload Artifact (${{ matrix.robot }})
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.robot }}
          path: |
            bin/*.bin
            bin/*.elf
          if-no-files-found: error

