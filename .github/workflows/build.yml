name: Build

on:
  push:
    branches: "**"
  pull_request:
    branches: "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        robot: [blue, orange]
        include:
          - robot: blue
            define: ROBOT_BLUE
          - robot: orange
            define: ROBOT_ORANGE
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run LemLib/pros-build for ${{ matrix.robot }}
        id: build
        uses: LemLib/pros-build@v3.0.0
        env:
          EXTRA_CXXFLAGS: -D${{ matrix.define }}

      - name: Upload Artifact (${{ matrix.robot }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}-${{ matrix.robot }}
          path: ${{ github.workspace }}/template/*

